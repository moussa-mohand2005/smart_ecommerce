name: Smart Shoe MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_ecommerce
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize test database
      env:
        MYSQL_PWD: root
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client
        mysql -h 127.0.0.1 -u root smart_ecommerce < schema.sql
        mysql -h 127.0.0.1 -u root smart_ecommerce < ci_seed.sql
        
    - name: Run ML Analytics (Testing Model)
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
        DB_NAME: smart_ecommerce
      run: |
        python step3_ml_analytics.py

    - name: Compile Kubeflow pipeline
      run: |
        python kubeflow_pipeline.py

    - name: Verify generated artifacts
      run: |
        test -f top_k_products.csv
        test -f footwear_correlations.csv || true
        test -f shoe_pipeline.yaml
